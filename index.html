<title>Arduino Math Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<style>
:root {
  --bg: #eef0f8;
  --panel: #f4f6fc;
  --surface: #ffffff;
  --border: #cdd2e8;
  --text: #1a1d30;
  --muted: #6a709a;
  --code-bg: #e2e6f5;
  --code-text: #2e3f9e;
  --btn-bg: #e6eaf6;
  --pip-ok: #2f9e44;
  --pip-err: #c92a2a;
  --pip-empty: #bcc2dc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070c1a; --panel: #0b1124; --surface: #0f1829;
    --border: #192640; --text: #ccdaff; --muted: #4a5a90;
    --code-bg: #060d1e; --code-text: #7aa4f0;
    --btn-bg: #141e38;
    --pip-ok: #3ecf64; --pip-err: #e05555; --pip-empty: #243050;
  }
}
:root[data-theme="dark"] {
  --bg: #070c1a; --panel: #0b1124; --surface: #0f1829;
  --border: #192640; --text: #ccdaff; --muted: #4a5a90;
  --code-bg: #060d1e; --code-text: #7aa4f0;
  --btn-bg: #141e38;
  --pip-ok: #3ecf64; --pip-err: #e05555; --pip-empty: #243050;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 44px;
  padding: 0 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-left { display: flex; align-items: baseline; gap: 10px; }
h1 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.sub { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); }

.ibtn {
  background: none; border: none; cursor: pointer;
  color: var(--muted); width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 5px; transition: color .12s, background .12s;
}
.ibtn:hover { color: var(--text); background: var(--btn-bg); }
.ibtn:focus-visible { outline: 2px solid #5282f5; outline-offset: 1px; }

.workspace { display: flex; flex: 1; min-height: 0; overflow: hidden; }

/* ── panel ── */
.panel {
  width: 360px; flex-shrink: 0;
  display: flex; flex-direction: column;
  background: var(--panel);
  border-right: 1px solid var(--border);
}

.panel-label {
  padding: 10px 14px 6px;
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--muted);
  flex-shrink: 0;
}

/* formula rows */
.frows {
  flex: 1; min-height: 0;
  overflow-y: auto;
  padding: 0 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.frows::-webkit-scrollbar { width: 3px; }
.frows::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.frow {
  display: flex;
  align-items: stretch;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  transition: border-color .12s;
}
.frow:focus-within { border-color: #5282f5; }

input[type="color"].cpick {
  width: 32px; flex-shrink: 0;
  border: none; padding: 0;
  cursor: pointer; background: none;
  border-right: 1px solid var(--border);
}
input[type="color"].cpick::-webkit-color-swatch-wrapper { padding: 4px; }
input[type="color"].cpick::-webkit-color-swatch { border: none; border-radius: 3px; }

.fcode {
  flex: 1; min-width: 0;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  background: var(--code-bg);
  color: var(--code-text);
  border: none;
  padding: 8px 9px;
  outline: none;
}
.fcode::placeholder { color: var(--pip-empty); }

.pip {
  width: 4px; flex-shrink: 0;
  background: var(--pip-empty);
  transition: background .2s;
}
.pip.ok  { background: var(--pip-ok); }
.pip.err { background: var(--pip-err); }

/* variable rows */
.vrows {
  flex-shrink: 0;
  padding: 0 14px 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.vrow {
  display: flex;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  transition: border-color .12s;
}
.vrow:focus-within { border-color: #5282f5; }
.vname {
  width: 80px; flex-shrink: 0;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  background: var(--code-bg);
  color: var(--code-text);
  border: none;
  border-right: 1px solid var(--border);
  padding: 7px 8px;
  outline: none;
}
.vname::placeholder { color: var(--pip-empty); }
.veq {
  padding: 0 7px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  flex-shrink: 0;
  user-select: none;
}
.vval {
  flex: 1; min-width: 0;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  background: transparent;
  color: var(--text);
  border: none;
  padding: 7px 8px 7px 0;
  outline: none;
}
.vval::-webkit-inner-spin-button,
.vval::-webkit-outer-spin-button { -webkit-appearance: none; }

/* arduino code editor */
.code-wrap {
  flex-shrink: 0;
  padding: 0 14px 8px;
}
.arduino-ta {
  width: 100%;
  height: 120px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  line-height: 1.55;
  background: var(--code-bg);
  color: var(--code-text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 9px;
  outline: none;
  resize: vertical;
  transition: border-color .12s;
}
.arduino-ta:focus { border-color: #5282f5; }
.arduino-ta::placeholder { color: var(--pip-empty); }
.code-status {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; font-weight: 400;
  letter-spacing: 0; text-transform: none;
  margin-left: 6px;
  color: var(--pip-ok);
}
.code-status.err { color: var(--pip-err); }

/* bottom controls */
.pbot {
  flex-shrink: 0;
  padding: 10px 14px 12px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.axlabel {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--muted);
}
.axis-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
}
.afield { display: flex; flex-direction: column; gap: 3px; }
.afield label {
  font-size: 9.5px; font-weight: 600;
  letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--muted);
}
.afield input {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px; font-variant-numeric: tabular-nums;
  background: var(--code-bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 5px; padding: 5px 7px;
  outline: none; width: 100%;
  transition: border-color .12s;
}
.afield input:focus { border-color: #5282f5; }
.afield input::-webkit-inner-spin-button,
.afield input::-webkit-outer-spin-button { -webkit-appearance: none; }

.helptext {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; color: var(--pip-empty); line-height: 1.6;
}

/* ── chart ── */
.chart-area {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  background: #060c1c;
}
.cwrap { flex: 1; min-height: 0; padding: 14px 10px 10px 6px; position: relative; }
.cwrap > div { position: absolute; inset: 14px 10px 10px 6px; }
.legend-bar {
  display: flex; flex-wrap: wrap;
  gap: 5px 14px; padding: 7px 16px;
  min-height: 30px;
  border-top: 1px solid rgba(255,255,255,0.04);
  background: #060c1c; flex-shrink: 0;
}
.litem {
  display: flex; align-items: center; gap: 6px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; color: #3e5070;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  max-width: 240px;
}
.lswatch { width: 18px; height: 2px; border-radius: 1px; flex-shrink: 0; }

@media (max-width: 980px) {
  html, body { height: auto; overflow: auto; }
  .workspace { flex-direction: column; height: auto; overflow: visible; }
  .panel {
    width: 100%;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border);
    overflow: visible;
  }
  .frows {
    flex: 0 0 auto;
    max-height: 130px;
    overflow-y: auto;
    display: block;
  }
  .frow { flex-shrink: 0; }
  .arduino-ta { height: 72px; }
  .chart-area {
    height: 50vh;
    min-height: 300px;
    flex: none;
  }
  .cwrap > div { position: absolute; inset: 10px 6px 6px 4px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; }
}

<script>
// ── icons ──────────────────────────────────────────────────
const IC = {
  sun:  `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`,
  moon: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,
};

// ── axis state ─────────────────────────────────────────────
let xMin = -2, xMax = 10, xStep = 0.1;
let yMin = 0, yMax = 270;
let xVarName = 'DeltaTemp';

// ── expression parser (no eval / Function — CSP safe) ──────
function evalF(text, dt, vars) {
  if (!text.trim()) return null;
  const src = text.trim();
  let pos = 0;

  const ws  = () => { while (pos < src.length && /\s/.test(src[pos])) pos++; };
  const peek = () => src[pos] || '';
  const eat  = () => src[pos++];

  function expr()    { return addSub(); }
  function addSub() {
    let v = mulDiv(); ws();
    while (peek() === '+' || peek() === '-') {
      const op = eat(); const r = mulDiv();
      v = op === '+' ? v + r : v - r; ws();
    }
    return v;
  }
  function mulDiv() {
    let v = unary(); ws();
    while (peek() === '*' || peek() === '/' || peek() === '%') {
      const op = eat(); const r = unary();
      v = op === '*' ? v * r : op === '/' ? v / r : v % r; ws();
    }
    return v;
  }
  function unary() {
    ws();
    if (peek() === '-') { eat(); return -primary(); }
    if (peek() === '+') { eat(); return  primary(); }
    return primary();
  }
  function primary() {
    ws();
    // number
    if (/[0-9.]/.test(peek())) {
      let s = '';
      while (/[0-9.]/.test(peek())) s += eat();
      return parseFloat(s);
    }
    // parenthesised group
    if (peek() === '(') {
      eat();
      const v = expr(); ws();
      if (peek() === ')') eat();
      return v;
    }
    // identifier → variable or function call
    if (/[A-Za-z_]/.test(peek())) {
      let name = '';
      while (/[A-Za-z0-9_]/.test(peek())) name += eat();
      ws();
      if (peek() === '(') {          // function call
        eat();
        const args = [];
        ws();
        if (peek() !== ')') {
          args.push(expr()); ws();
          while (peek() === ',') { eat(); args.push(expr()); ws(); }
        }
        if (peek() === ')') eat();
        switch (name) {
          case 'min':       return Math.min(...args);
          case 'max':       return Math.max(...args);
          case 'abs':       return Math.abs(args[0]);
          case 'sqrt':      return Math.sqrt(args[0]);
          case 'pow':       return Math.pow(args[0], args[1]);
          case 'floor':     return Math.floor(args[0]);
          case 'ceil':      return Math.ceil(args[0]);
          case 'round':     return Math.round(args[0]);
          case 'constrain': return Math.min(args[2], Math.max(args[1], args[0]));
          case 'map':       return args[3] + (args[0]-args[1])*(args[4]-args[3])/(args[2]-args[1]);
          case 'sq':        return args[0] * args[0];
          case 'cos':       return Math.cos(args[0]);
          case 'sin':       return Math.sin(args[0]);
          case 'tan':       return Math.tan(args[0]);
          case 'acos':      return Math.acos(args[0]);
          case 'asin':      return Math.asin(args[0]);
          case 'atan':      return Math.atan(args[0]);
          case 'atan2':     return Math.atan2(args[0], args[1]);
          case 'log':       return Math.log(args[0]);
          case 'exp':       return Math.exp(args[0]);
          case 'random':    return args.length === 1
            ? Math.floor(Math.random() * args[0])
            : Math.floor(Math.random() * (args[1] - args[0])) + Math.floor(args[0]);
          case 'randomSeed': return 0;
          default: throw new Error('Unknown fn: ' + name);
        }
      }
      if (name === xVarName) return dt;
      if (vars && Object.prototype.hasOwnProperty.call(vars, name)) return vars[name];
      // Arduino built-in constants
      if (name === 'PI')      return Math.PI;
      if (name === 'TWO_PI')  return Math.PI * 2;
      if (name === 'HALF_PI') return Math.PI / 2;
      if (name === 'E')       return Math.E;
      if (name === 'DEG_TO_RAD') return Math.PI / 180;
      if (name === 'RAD_TO_DEG') return 180 / Math.PI;
      throw new Error('Unknown var: ' + name);
    }
    throw new Error('Unexpected: ' + peek());
  }

  try {
    ws();
    const v = expr(); ws();
    if (pos !== src.length) throw new Error('Leftover: ' + src.slice(pos));
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  } catch { return null; }
}

// ── Arduino code interpreter ───────────────────────────────
function runArduinoCode(src, seedVars) {
  const vars = Object.assign({}, seedVars);
  const statusEl = document.getElementById('codeStatus');

  // strip block and line comments
  const cleaned = src
    .replace(/\/\*[\s\S]*?\*\//g, ' ')
    .replace(/\/\/[^\n]*/g, '');

  const TYPE_RE = /^(?:(?:const|static|unsigned|signed)\s+)*(?:int|float|double|long|byte|word|boolean|bool|char|short)\s+/;
  const statements = cleaned.split(';').map(s => s.trim()).filter(Boolean);
  let errorMsg = null;
  let count = 0;

  for (const stmt of statements) {
    const body = stmt.replace(TYPE_RE, '').trim();
    const eqIdx = body.indexOf('=');
    if (eqIdx > 0) {
      const name = body.slice(0, eqIdx).trim();
      const exprStr = body.slice(eqIdx + 1).trim();
      if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
        try {
          const val = evalF(exprStr, null, vars);
          if (val !== null) { vars[name] = val; count++; }
          else { errorMsg = 'bad expr: ' + exprStr.slice(0, 20); }
        } catch(e) { errorMsg = e.message.slice(0, 30); }
      }
    } else {
      // declaration without init → 0
      const name = body.trim();
      if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) { vars[name] = 0; count++; }
    }
  }

  if (errorMsg) {
    statusEl.textContent = '✗ ' + errorMsg;
    statusEl.className = 'code-status err';
  } else if (count > 0) {
    statusEl.textContent = count + ' var' + (count === 1 ? '' : 's');
    statusEl.className = 'code-status';
  } else {
    statusEl.textContent = '';
    statusEl.className = 'code-status';
  }

  return vars;
}

function xVals() {
  const pts = [];
  const n = Math.round((xMax - xMin) / xStep);
  for (let i = 0; i <= n; i++) pts.push(+(xMin + i * xStep).toFixed(8));
  return pts;
}

// ── chart ──────────────────────────────────────────────────
const CHART_BG = '#060c1c';
const GRID_COL = 'rgba(255,255,255,0.05)';
const TICK_COL = '#354060';
const MONO = { family: "'IBM Plex Mono', monospace", size: 10 };

const bgPlugin = {
  id: 'bg',
  beforeDraw(ch) {
    ch.ctx.save();
    ch.ctx.fillStyle = CHART_BG;
    ch.ctx.fillRect(0, 0, ch.width, ch.height);
    ch.ctx.restore();
  }
};

const chart = new Chart(document.getElementById('mc').getContext('2d'), {
  type: 'line',
  plugins: [bgPlugin],
  data: { datasets: [] },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    parsing: false,
    interaction: { mode: 'index', intersect: false },
    scales: {
      x: {
        type: 'linear', min: xMin, max: xMax,
        border: { display: false },
        grid: { color: GRID_COL },
        ticks: { color: TICK_COL, font: MONO, maxTicksLimit: 14 },
        title: { display: true, text: 'DeltaTemp', color: TICK_COL,
          font: { ...MONO, size: 11 }, padding: { top: 5 } }
      },
      y: {
        min: 0, max: 270,
        border: { display: false },
        grid: { color: GRID_COL },
        ticks: { color: TICK_COL, font: MONO, stepSize: 50 },
        title: { display: false }
      }
    },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: 'rgba(4,9,22,0.95)',
        borderColor: 'rgba(255,255,255,0.07)',
        borderWidth: 1,
        titleColor: '#3a5075',
        bodyColor: '#88aadd',
        padding: 10,
        titleFont: MONO,
        bodyFont: { ...MONO, size: 12 },
        callbacks: {
          title: items => xVarName + ' = ' + items[0]?.parsed.x,
          label: item => item.dataset.label + ': ' + Math.round(item.parsed.y)
        }
      }
    }
  }
});

// ── update from DOM ────────────────────────────────────────
function updateAll() {
  const xs = xVals();
  const datasets = [];
  const legendItems = [];

  // 1. quick variable rows
  const quickVars = {};
  document.querySelectorAll('#vrows .vrow').forEach(vrow => {
    const name = vrow.querySelector('.vname').value.trim();
    const val  = parseFloat(vrow.querySelector('.vval').value);
    if (name && /^[A-Za-z_][A-Za-z0-9_]*$/.test(name) && !isNaN(val)) {
      quickVars[name] = val;
    }
  });
  // 2. run Arduino code (can use quick vars, overrides allowed)
  const codeSrc = document.getElementById('arduinoCode').value;
  const vars = runArduinoCode(codeSrc, quickVars);

  document.querySelectorAll('.frow').forEach((row, i) => {
    const colorEl = row.querySelector('.cpick');
    const codeEl  = row.querySelector('.fcode');
    const pip     = row.querySelector('.pip');
    const text = codeEl.value.trim();
    const color = colorEl.value;

    if (!text) {
      pip.className = 'pip';
      return;
    }

    const test = evalF(text, 5, vars);
    if (test === null) {
      pip.className = 'pip err';
      return;
    }

    pip.className = 'pip ok';
    const label = text.length > 38 ? text.substring(0, 36) + '…' : text;

    datasets.push({
      label,
      data: xs.map(x => ({ x, y: evalF(text, x, vars) })),
      borderColor: color,
      backgroundColor: 'transparent',
      borderWidth: 2.5,
      pointRadius: 0,
      pointHoverRadius: 4,
      pointHoverBackgroundColor: color,
      tension: 0,
    });

    legendItems.push({ color, label });
  });

  chart.data.datasets = datasets;
  chart.options.scales.x.min = xMin;
  chart.options.scales.x.max = xMax;
  chart.options.scales.x.title.text = xVarName;
  chart.options.scales.y.min = yMin;
  chart.options.scales.y.max = yMax;
  chart.update();

  // sync placeholders and help text
  document.querySelectorAll('.fcode').forEach(el => {
    el.placeholder = 'type a formula using ' + xVarName + '…';
  });
  document.getElementById('helptext').innerHTML =
    'var: ' + xVarName + ' &nbsp;·&nbsp; fns: min max abs sqrt pow floor ceil round constrain map';

  document.getElementById('legend').innerHTML = legendItems.map(l =>
    `<div class="litem"><div class="lswatch" style="background:${l.color}"></div><span>${l.label}</span></div>`
  ).join('');
}

// ── listeners ──────────────────────────────────────────────
document.getElementById('frows').addEventListener('input', updateAll);
document.getElementById('vrows').addEventListener('input', updateAll);
document.getElementById('arduinoCode').addEventListener('input', updateAll);

document.getElementById('xVarName').addEventListener('input', e => {
  const v = e.target.value.trim();
  if (v && /^[A-Za-z_][A-Za-z0-9_]*$/.test(v)) {
    xVarName = v;
    updateAll();
  }
});

['xMin','xMax','xStep','yMin','yMax'].forEach(id => {
  document.getElementById(id).addEventListener('change', e => {
    const v = parseFloat(e.target.value);
    if (isNaN(v)) return;
    if      (id === 'xMin')  xMin  = v;
    else if (id === 'xMax')  xMax  = v;
    else if (id === 'xStep') xStep = Math.max(0.001, v);
    else if (id === 'yMin')  yMin  = v;
    else if (id === 'yMax')  yMax  = v;
    updateAll();
  });
});

// ── theme ──────────────────────────────────────────────────
let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
const themeBtn = document.getElementById('themeBtn');

function setTheme(d) {
  dark = d;
  document.documentElement.dataset.theme = d ? 'dark' : 'light';
  themeBtn.innerHTML = d ? IC.sun : IC.moon;
}

themeBtn.addEventListener('click', () => setTheme(!dark));
setTheme(dark);

// ── init ───────────────────────────────────────────────────
updateAll();
</script>
